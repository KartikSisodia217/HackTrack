<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>HackTrack</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-loading" id="auth-loading" role="status">
    <span class="auth-spinner" aria-hidden="true"></span><span class="sr-only">Loading HackTrack…</span>
  </div>

  <main class="auth-screen" id="auth-screen" hidden>
    <div class="auth-panel">
      <h1>HackTrack</h1>
      <div class="auth-actions">
        <button class="btn btn-primary" id="google-sign-in" type="button">Continue with Google</button>
        <button class="btn btn-secondary" id="guest-mode" type="button">Use without login</button>
      </div>
      <p class="auth-error" id="auth-error" role="alert" hidden></p>
    </div>
  </main>

  <main class="app-shell" id="app-shell" hidden>
    <header class="topbar">
      <h1>HackTrack</h1>
      <div class="topbar-actions">
        <button class="btn btn-quiet" id="account-button" type="button">Sign in</button>
        <button class="btn btn-primary" id="add-button" type="button">
          <svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Add
        </button>
      </div>
    </header>
    <p class="app-notice" id="app-notice" role="status" hidden></p>
    <section aria-label="Your hackathons">
      <ul class="hack-list" id="hack-list"></ul>
      <div class="empty-state" id="empty-state" hidden>
        <p class="empty-title">No hackathons yet.</p>
        <p class="empty-hint">Add your first hackathon to start tracking deadlines.</p>
      </div>
    </section>
  </main>

  <div class="modal-root" id="modal-root" hidden></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
