<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>HackTrack</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #161616;
      --surface: #1d1d1c;
      --surface-raised: #252523;
      --surface-hover: #2a2927;
      --line: #353431;
      --line-soft: #2a2927;
      --text: #f4f3f0;
      --text-soft: #b7b5af;
      --text-muted: #88857f;
      --purple: #8f7cf6;
      --purple-hover: #a797ff;
      --purple-deep: #6e5ad8;
      --red: #ec7772;
      --red-hover: #ff8b84;
      --focus: rgba(143, 124, 246, .35);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--page); }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

    .app-shell { width: min(100% - 64px, 1280px); margin: 0 auto; padding: 54px 0 80px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 42px; }
    h1 { margin: 0; color: var(--text); font-size: clamp(32px, 5vw, 40px); font-weight: 600; line-height: 1.15; letter-spacing: -.8px; }
    .btn { min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 14px; border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--text); font-size: 14px; font-weight: 500; line-height: 1.3; transition: background-color .16s ease, border-color .16s ease, color .16s ease, transform .16s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--purple); color: #fff; }
    .btn-primary:hover { background: var(--purple-hover); }
    .btn-secondary { border-color: #46443f; background: transparent; color: var(--text-soft); }
    .btn-secondary:hover { background: var(--surface-hover); border-color: #57544f; color: var(--text); }
    .btn-danger { background: #b9504d; color: #fff; }
    .btn-danger:hover { background: #ca5b56; }
    .btn-quiet { color: var(--text-soft); }
    .btn-quiet:hover { background: var(--surface-hover); color: var(--text); }
    .button-icon { width: 16px; height: 16px; flex: 0 0 auto; }

    .hack-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 34px 0; margin: 0; padding: 0; list-style: none; }
    .hack-item { position: relative; min-width: 0; padding: 0 20px 0 8px; margin-right: 18px; border-right: 1px solid var(--line); }
    .hack-item:nth-child(4n), .hack-item:last-child { border-right-color: transparent; }
    .hack-name { min-height: 46px; margin: 0 0 13px; padding-right: 25px; color: var(--text); font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -.15px; }
    .details { display: grid; gap: 9px; }
    .detail { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; align-items: center; min-width: 0; }
    .detail-label { color: var(--text-muted); font-size: 11px; font-weight: 500; line-height: 1.4; letter-spacing: .2px; text-transform: uppercase; }
    .detail-value { width: fit-content; max-width: calc(100% + 14px); min-height: 24px; padding: 2px 7px; margin: -2px -7px; overflow: hidden; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-soft); text-align: left; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 400; line-height: 1.45; transition: color .16s ease, background-color .16s ease; }
    .detail-value { justify-self: end; text-align: right; }
    .detail-value:hover { background: var(--surface-hover); color: var(--text); }
    .detail-value::after { content: "Edit"; display: inline-block; margin-left: 8px; color: var(--purple); font-size: 11px; font-weight: 500; opacity: 0; transform: translateX(-2px); transition: opacity .16s ease, transform .16s ease; }
    .detail-value:hover::after, .detail-value:focus-visible::after { opacity: .9; transform: translateX(0); }
    .homepage-value { display: inline-flex; align-items: center; justify-self: end; min-width: 0; max-width: calc(100% + 14px); gap: 2px; min-height: 24px; margin: -2px -7px; }
    .homepage-link { display: inline-flex; align-items: center; min-width: 0; min-height: 24px; padding: 2px 7px; overflow: hidden; border-radius: var(--radius-sm); color: var(--text-soft); text-overflow: ellipsis; white-space: nowrap; font-size: 14px; text-decoration: none; transition: color .16s ease, background-color .16s ease; }
    .homepage-link:hover { background: var(--surface-hover); color: var(--purple-hover); text-decoration: underline; text-underline-offset: 3px; }
    .homepage-link::after { content: "↗"; margin-left: 6px; font-size: 13px; text-decoration: none; }
    .not-set-value { padding: 2px 7px; color: var(--text-muted); font-size: 14px; }
    .edit-icon-button { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); opacity: 0; pointer-events: none; transition: opacity .16s ease, color .16s ease, background-color .16s ease; }
    .homepage-value:hover .edit-icon-button, .homepage-value:focus-within .edit-icon-button { opacity: 1; pointer-events: auto; }
    .edit-icon-button:hover { background: var(--surface-hover); color: var(--text); }
    .delete-button { position: absolute; top: -6px; right: -5px; width: 29px; height: 29px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--radius-sm); background: var(--page); color: var(--text-muted); opacity: 0; transition: opacity .16s ease, color .16s ease, background-color .16s ease; }
    .hack-item:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { background: rgba(236, 119, 114, .1); color: var(--red); }
    .empty-state { padding: 5px 0; color: var(--text-soft); }
    .empty-state p { margin: 0; }
    .empty-title { color: var(--text); font-size: 18px; font-weight: 500; }
    .empty-hint { margin-top: 5px !important; color: var(--text-muted); }

    .modal-root[hidden] { display: none; }
    .modal-root { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 22px; }
    .backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .62); animation: fade-in .16s ease both; }
    .dialog { position: relative; width: min(100%, 456px); max-height: calc(100vh - 44px); overflow: auto; border: 1px solid #3b3936; border-radius: var(--radius-lg); background: var(--surface); box-shadow: 0 20px 55px rgba(0,0,0,.45); animation: dialog-in .18s ease both; }
    .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 24px 0; }
    .dialog-title { margin: 0; color: var(--text); font-size: 20px; font-weight: 600; line-height: 1.35; letter-spacing: -.25px; }
    .close-button { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; margin: -6px -6px 0 0; padding: 0; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); }
    .close-button:hover { background: var(--surface-hover); color: var(--text); }
    .dialog-body { padding: 14px 24px 24px; }
    .dialog-copy { max-width: 340px; margin: 0; color: var(--text-soft); font-size: 15px; line-height: 1.55; }
    .form-stack { display: grid; gap: 18px; }
    .field { display: grid; gap: 7px; }
    label { color: var(--text-soft); font-size: 13px; font-weight: 500; }
    input { width: 100%; height: 42px; padding: 9px 11px; border: 1px solid #45423e; border-radius: var(--radius-md); background: #171716; color: var(--text); font-size: 15px; line-height: 1.4; transition: border-color .16s ease, box-shadow .16s ease, background-color .16s ease; }
    input::placeholder { color: #77746f; }
    input:hover { border-color: #5a5651; }
    input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px var(--focus); outline: 0; }
    input[type="date"] { color-scheme: dark; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 0 24px 24px; }
    .dialog-actions .btn { min-width: 82px; }
    .confirm-dialog .dialog-body { padding-bottom: 26px; }
    .destructive-title { color: var(--text); }
    .validation { display: none; margin: -9px 0 0; color: var(--red); font-size: 12px; }
    .validation.is-visible { display: block; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dialog-in { from { opacity: 0; transform: scale(.975) translateY(4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @media (max-width: 980px) {
      .app-shell { width: min(100% - 48px, 800px); }
      .hack-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hack-item:nth-child(4n) { border-right-color: var(--line); }
      .hack-item:nth-child(2n), .hack-item:last-child { border-right-color: transparent; }
    }
    @media (max-width: 560px) {
      .app-shell { width: min(100% - 32px, 760px); padding-top: 34px; }
      .topbar { margin-bottom: 32px; }
      .hack-list { grid-template-columns: 1fr; gap: 28px; }
      .hack-item, .hack-item:nth-child(4n), .hack-item:nth-child(2n) { padding: 0 32px 0 8px; margin-right: 0; border-right-color: transparent; }
      .hack-name { min-height: auto; margin-bottom: 12px; }
      .delete-button { opacity: 1; top: -6px; right: 0; }
      .detail-value::after { display: none; }
      .dialog-head { padding: 21px 20px 0; }
      .dialog-body { padding: 14px 20px 21px; }
      .dialog-actions { padding: 0 20px 20px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>HackTrack</h1>
      <button class="btn btn-primary" id="add-button" type="button">
        <svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Add
      </button>
    </header>
    <section aria-label="Your hackathons">
      <ul class="hack-list" id="hack-list"></ul>
      <div class="empty-state" id="empty-state" hidden>
        <p class="empty-title">No hackathons yet.</p>
        <p class="empty-hint">Add your first hackathon to start tracking deadlines.</p>
      </div>
    </section>
  </main>

  <div class="modal-root" id="modal-root" hidden></div>

  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'hacktrack-hackathons-v1';
      const list = document.getElementById('hack-list');
      const emptyState = document.getElementById('empty-state');
      const modalRoot = document.getElementById('modal-root');
      const addButton = document.getElementById('add-button');
      let hackathons = loadHackathons();
      let previouslyFocused = null;

      function loadHackathons() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          if (!Array.isArray(stored)) return [];
          const sorted = sortByDeadline(stored.filter(isValidHackathon).map(item => ({ id: item.id, name: item.name.trim(), stage: item.stage.trim(), deadline: item.deadline, offlineRound: typeof item.offlineRound === 'string' ? item.offlineRound : '', homepage: typeof item.homepage === 'string' ? item.homepage : '' })));
          localStorage.setItem(STORAGE_KEY, JSON.stringify(sorted));
          return sorted;
        } catch (_) { return []; }
      }
      function isValidHackathon(item) {
        return item && typeof item.id === 'string' && typeof item.name === 'string' && typeof item.stage === 'string' && typeof item.deadline === 'string';
      }
      function sortByDeadline(items) {
        return items.map((item, index) => ({ item, index })).sort((a, b) => {
          const aDeadline = a.item.deadline || a.item.offlineRound;
          const bDeadline = b.item.deadline || b.item.offlineRound;
          if (!aDeadline && !bDeadline) return a.index - b.index;
          if (!aDeadline) return 1;
          if (!bDeadline) return -1;
          return aDeadline.localeCompare(bDeadline) || a.index - b.index;
        }).map(entry => entry.item);
      }
      function sortHackathons() { hackathons = sortByDeadline(hackathons); }
      function saveHackathons() { localStorage.setItem(STORAGE_KEY, JSON.stringify(hackathons)); }
      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
      }
      function prettyDate(value) {
        if (!value) return 'Not set';
        const parts = /^([0-9]{4})-([0-9]{2})-([0-9]{2})(?:T([0-9]{2}):([0-9]{2}))?$/.exec(value);
        if (!parts) return value;
        const date = new Date(Number(parts[1]), Number(parts[2]) - 1, Number(parts[3]), Number(parts[4] || 0), Number(parts[5] || 0));
        if (Number.isNaN(date.getTime())) return value;
        const options = { day: '2-digit', month: 'short', year: 'numeric' };
        if (parts[4]) Object.assign(options, { hour: 'numeric', minute: '2-digit' });
        return new Intl.DateTimeFormat(undefined, options).format(date);
      }
      function prettyHomepage(value) {
        if (!value) return 'Not set';
        try { return new URL(value).hostname.replace(/^www\./, ''); } catch (_) { return value; }
      }
      function safeHomepageUrl(value) {
        try {
          const url = new URL(value);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
        } catch (_) { return ''; }
      }
      function renderHackathons() {
        sortHackathons();
        list.innerHTML = hackathons.map(hackathon => `
          <li class="hack-item" data-id="${escapeHtml(hackathon.id)}">
            <h2 class="hack-name">${escapeHtml(hackathon.name)}</h2>
            <div class="details">
              <div class="detail"><span class="detail-label">Stage</span><button class="detail-value" type="button" data-action="edit-stage" aria-label="Edit stage for ${escapeHtml(hackathon.name)}">${escapeHtml(hackathon.stage || 'Not set')}</button></div>
              <div class="detail"><span class="detail-label">Next deadline</span><button class="detail-value" type="button" data-action="edit-deadline" aria-label="Edit next deadline for ${escapeHtml(hackathon.name)}">${escapeHtml(prettyDate(hackathon.deadline))}</button></div>
              <div class="detail"><span class="detail-label">Offline round</span><button class="detail-value" type="button" data-action="edit-offline-round" aria-label="Edit offline round for ${escapeHtml(hackathon.name)}">${escapeHtml(prettyDate(hackathon.offlineRound))}</button></div>
              <div class="detail"><span class="detail-label">Homepage</span><span class="homepage-value">
                  ${safeHomepageUrl(hackathon.homepage) ? `<a class="homepage-link" href="${escapeHtml(safeHomepageUrl(hackathon.homepage))}" target="_blank" rel="noopener noreferrer">${escapeHtml(prettyHomepage(hackathon.homepage))}</a>` : `<span class="not-set-value">Not set</span>`}
                  <button class="edit-icon-button" type="button" data-action="edit-homepage" aria-label="Edit homepage link for ${escapeHtml(hackathon.name)}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13.5 6.5 17.5 10.5M4 20l3.8-.9L19.1 7.8a2.12 2.12 0 0 0-3-3L4.9 16.1 4 20Z" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                </span></div>
            </div>
            <button class="delete-button" type="button" data-action="delete" aria-label="Delete ${escapeHtml(hackathon.name)}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M9 7l.7-2h4.6l.7 2m-9 0 1 13h10l1-13" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </li>`).join('');
        list.hidden = hackathons.length === 0;
        emptyState.hidden = hackathons.length !== 0;
      }
      function uuid() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : `hack-${Date.now()}-${Math.random().toString(16).slice(2)}`; }
      function closeModal() {
        if (modalRoot.hidden) return;
        modalRoot.hidden = true;
        modalRoot.innerHTML = '';
        document.body.style.overflow = '';
        if (previouslyFocused) previouslyFocused.focus();
        previouslyFocused = null;
      }
      function openModal(markup, focusSelector) {
        previouslyFocused = document.activeElement;
        modalRoot.innerHTML = `<div class="backdrop" data-dismiss></div>${markup}`;
        modalRoot.hidden = false;
        document.body.style.overflow = 'hidden';
        const target = modalRoot.querySelector(focusSelector || '[data-autofocus], input, button');
        if (target) requestAnimationFrame(() => target.focus());
      }
      function modalShell(title, content, actions, extraClass = '') {
        return `<section class="dialog ${extraClass}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="dialog-head"><h2 class="dialog-title" id="modal-title">${title}</h2><button class="close-button" type="button" aria-label="Close dialog" data-dismiss>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button></div>
          <div class="dialog-body">${content}</div><div class="dialog-actions">${actions}</div>
        </section>`;
      }
      function openAddModal() {
        openModal(modalShell('Add hackathon', `<form class="form-stack" id="add-form">
          <div class="field"><label for="hackathon-name">Hackathon name</label><input id="hackathon-name" name="name" type="text" autocomplete="off" placeholder="e.g. Gemma 3 Hackathon" required maxlength="120" data-autofocus></div>
          <div class="field"><label for="hackathon-stage">Current stage <span aria-hidden="true">(optional)</span></label><input id="hackathon-stage" name="stage" type="text" autocomplete="off" placeholder="e.g. Prototype" maxlength="80"></div>
          <div class="field"><label for="hackathon-deadline">Next deadline <span aria-hidden="true">(optional)</span></label><input id="hackathon-deadline" name="deadline" type="datetime-local"></div>
          <div class="field"><label for="hackathon-offline-round">Offline round <span aria-hidden="true">(optional)</span></label><input id="hackathon-offline-round" name="offlineRound" type="datetime-local"></div>
          <div class="field"><label for="hackathon-homepage">Homepage link <span aria-hidden="true">(optional)</span></label><input id="hackathon-homepage" name="homepage" type="url" autocomplete="url" placeholder="https://example.com"></div>
          <p class="validation" id="form-error" role="alert"></p>
        </form>`, `<button class="btn btn-quiet" type="button" data-dismiss>Cancel</button><button class="btn btn-primary" type="submit" form="add-form">Add Hackathon</button>`), '#hackathon-name');
        document.getElementById('add-form').addEventListener('submit', event => {
          event.preventDefault();
          const form = new FormData(event.currentTarget);
          const name = form.get('name').trim(), stage = form.get('stage').trim(), deadline = form.get('deadline'), offlineRound = form.get('offlineRound'), homepage = form.get('homepage').trim();
          if (!name) return showError('Please enter a hackathon name.');
          hackathons.push({ id: uuid(), name, stage, deadline, offlineRound, homepage });
          sortHackathons();
          saveHackathons(); renderHackathons(); closeModal();
        });
      }
      function showError(message) { const error = document.getElementById('form-error'); error.textContent = message; error.classList.add('is-visible'); }
      function openEditConfirmation(id, field) {
        const item = hackathons.find(entry => entry.id === id); if (!item) return;
        const fieldTitle = field === 'stage' ? 'stage' : field === 'homepage' ? 'homepage link' : field === 'offlineRound' ? 'offline round' : 'next deadline';
        openModal(modalShell(`Edit ${fieldTitle}?`, `<p class="dialog-copy">Are you sure you want to edit this ${fieldTitle} for ${escapeHtml(item.name)}?</p>`, `<button class="btn btn-quiet" type="button" data-dismiss>Cancel</button><button class="btn btn-primary" type="button" id="confirm-continue" data-autofocus>Continue</button>`, 'confirm-dialog'), '#confirm-continue');
        document.getElementById('confirm-continue').addEventListener('click', () => openFieldEditor(id, field));
      }
      function openFieldEditor(id, field) {
        const item = hackathons.find(entry => entry.id === id); if (!item) return;
        const isStage = field === 'stage';
        const isHomepage = field === 'homepage';
        const isOfflineRound = field === 'offlineRound';
        const label = isStage ? 'Current stage' : isHomepage ? 'Homepage link' : isOfflineRound ? 'Offline round' : 'Next deadline';
        const input = isStage
          ? `<input id="field-value" name="value" type="text" autocomplete="off" maxlength="80" value="${escapeHtml(item.stage)}" data-autofocus>`
          : isHomepage
            ? `<input id="field-value" name="value" type="url" autocomplete="url" placeholder="https://example.com" value="${escapeHtml(item.homepage || '')}" data-autofocus>`
            : `<input id="field-value" name="value" type="datetime-local" value="${escapeHtml(item[field] || '')}" data-autofocus>`;
        openModal(modalShell(`Edit ${isStage ? 'stage' : isHomepage ? 'homepage link' : isOfflineRound ? 'offline round' : 'next deadline'}`, `<form class="form-stack" id="edit-form"><div class="field"><label for="field-value">${label}</label>${input}</div><p class="validation" id="form-error" role="alert"></p></form>`, `<button class="btn btn-quiet" type="button" data-dismiss>Cancel</button><button class="btn btn-primary" type="submit" form="edit-form">Save</button>`), '#field-value');
        document.getElementById('edit-form').addEventListener('submit', event => {
          event.preventDefault(); const value = new FormData(event.currentTarget).get('value').trim();
          const target = hackathons.find(entry => entry.id === id); if (!target) return closeModal();
          target[field] = value;
          if (field === 'deadline' || field === 'offlineRound') sortHackathons();
          saveHackathons(); renderHackathons(); closeModal();
        });
      }
      function openDeleteConfirmation(id) {
        const item = hackathons.find(entry => entry.id === id); if (!item) return;
        openModal(modalShell('Delete hackathon?', `<p class="dialog-copy">Are you sure you want to delete <strong>${escapeHtml(item.name)}</strong>? This can’t be undone.</p>`, `<button class="btn btn-quiet" type="button" data-dismiss>Cancel</button><button class="btn btn-danger" type="button" id="confirm-delete" data-autofocus>Delete</button>`, 'confirm-dialog'), '#confirm-delete');
        document.getElementById('confirm-delete').addEventListener('click', () => { hackathons = hackathons.filter(entry => entry.id !== id); saveHackathons(); renderHackathons(); closeModal(); });
      }
      addButton.addEventListener('click', openAddModal);
      list.addEventListener('click', event => {
        const action = event.target.closest('[data-action]'); if (!action) return;
        const item = action.closest('.hack-item'); if (!item) return;
        if (action.dataset.action === 'edit-stage') openEditConfirmation(item.dataset.id, 'stage');
        if (action.dataset.action === 'edit-deadline') openEditConfirmation(item.dataset.id, 'deadline');
        if (action.dataset.action === 'edit-offline-round') openEditConfirmation(item.dataset.id, 'offlineRound');
        if (action.dataset.action === 'edit-homepage') openFieldEditor(item.dataset.id, 'homepage');
        if (action.dataset.action === 'delete') openDeleteConfirmation(item.dataset.id);
      });
      modalRoot.addEventListener('click', event => { if (event.target.closest('[data-dismiss]')) closeModal(); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape' && !modalRoot.hidden) closeModal(); });
      renderHackathons();
    })();
  </script>
</body>
</html>
